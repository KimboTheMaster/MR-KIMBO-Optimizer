name: MR KIMBO v17 - Legacy baseline CI

on:
  push:
    branches:
      - 'feature/v17-*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-baseline:
    name: Restore, inspect and build legacy source (no execution)
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Inspect legacy risk hooks (read-only)
        shell: pwsh
        run: ./scripts/Inspect-LegacyRisk.ps1

      - name: Restore legacy NuGet packages
        shell: pwsh
        run: nuget restore Optimizer.sln -NonInteractive

      - name: Build inherited WinForms solution
        shell: pwsh
        run: msbuild.exe Optimizer.sln /t:Build /p:Configuration=Release "/p:Platform=Any CPU" /m /verbosity:minimal

      - name: Confirm built binary exists (do not run)
        shell: pwsh
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE 'bin/release/Optimizer.exe'
          if (-not (Test-Path -LiteralPath $binary)) {
            throw "Expected legacy output missing: $binary"
          }
          Write-Host "Legacy executable built successfully. NOT executed or published."
